<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXA — Your Life. Your Choices.</title>

  <meta
    name="description"
    content="NEXA is a modern virtual life game where every choice matters."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>NEXA</h1>
    <p>Your life. Your choices.</p>
  </header>

  <main>

    <section id="game">

      <h2>Welcome to NEXA</h2>

      <p>
        Build your life, make choices and create your own story.
      </p>

      <div class="player-stats">

        <div>
          <span>👤</span>
          <strong id="playerName">Player</strong>
        </div>

        <div>
          <span>💰</span>
          <strong id="money">€500</strong>
        </div>

        <div>
          <span>⚡</span>
          <strong id="energy">100%</strong>
        </div>

        <div>
          <span>😊</span>
          <strong id="happiness">75%</strong>
        </div>

      </div>

      <button type="button" onclick="startGame()">
        Start Your Life
      </button>

    </section>

  </main>

  <footer>
    <p>© 2026 NEXA</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
